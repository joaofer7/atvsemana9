<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Commerce - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1c2128;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }
        .brand span { color: #007bff; }
        .form-control {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
        }
        .form-control:focus {
            background: #0d1117;
            border-color: #007bff;
            color: #c9d1d9;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
        }
        .form-label { color: #8b949e; font-size: 0.875rem; }
        .btn-login {
            background: #007bff;
            border: none;
            border-radius: 8px;
            padding: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #0056b3; }
        .divider { color: #30363d; }
        #msg-erro {
            display: none;
            background: #2d1b1b;
            border: 1px solid #dc3545;
            border-radius: 8px;
            color: #f85149;
            padding: 0.6rem 1rem;
            font-size: 0.875rem;
        }
        .hint-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            color: #8b949e;
        }
        .hint-box code {
            color: #79c0ff;
            background: #1c2128;
            padding: 1px 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand mb-1"><span>LITTLE</span> COMMERCE</div>
            <p class="text-secondary small mb-0">Faça login para continuar</p>
        </div>

        <div id="msg-erro">
            <i class="fa-solid fa-circle-exclamation me-1"></i>
            Login ou senha incorretos. Tente novamente.
        </div>

        <div class="mb-3 mt-3">
            <label for="input-login" class="form-label">Login</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0" style="border-color:#30363d;color:#8b949e;">
                    <i class="fa-solid fa-user"></i>
                </span>
                <input type="text" id="input-login" class="form-control border-start-0"
                       placeholder="Digite seu login" autocomplete="username">
            </div>
        </div>

        <div class="mb-4">
            <label for="input-senha" class="form-label">Senha</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0" style="border-color:#30363d;color:#8b949e;">
                    <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" id="input-senha" class="form-control border-start-0"
                       placeholder="Digite sua senha" autocomplete="current-password">
            </div>
        </div>

        <button class="btn btn-primary btn-login w-100" onclick="handleLogin()">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
        </button>

        <hr class="my-4 divider">

        <div class="hint-box">
            <i class="fa-solid fa-circle-info me-1"></i>
            Usuários de teste:<br>
            Login: <code>admin</code> | Senha: <code>123</code><br>
            Login: <code>user</code> | Senha: <code>123</code>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Carrega usuários (simulando JSON Server)
        function getUsuarios() {
            const dados = localStorage.getItem('lc_usuarios');
            if (dados) return JSON.parse(dados);
            const padrao = [
                { id: 1, nome: "Administrador", login: "admin", senha: "123", email: "admin@littlecommerce.com" },
                { id: 2, nome: "Usuário", login: "user", senha: "123", email: "user@littlecommerce.com" }
            ];
            localStorage.setItem('lc_usuarios', JSON.stringify(padrao));
            return padrao;
        }

        function handleLogin() {
            const login = document.getElementById('input-login').value.trim();
            const senha = document.getElementById('input-senha').value;
            const msgErro = document.getElementById('msg-erro');

            const usuarios = getUsuarios();
            const usuario = usuarios.find(u => u.login === login && u.senha === senha);

            if (usuario) {
                const usuarioCorrente = {
                    id: usuario.id,
                    nome: usuario.nome,
                    login: usuario.login,
                    senha: usuario.senha,
                    email: usuario.email
                };
                sessionStorage.setItem('usuarioCorrente', JSON.stringify(usuarioCorrente));
                window.location.href = '../../index.html';
            } else {
                msgErro.style.display = 'block';
                document.getElementById('input-senha').value = '';
            }
        }

        // Permite pressionar Enter para fazer login
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        // Se já estiver logado, redireciona para home
        if (sessionStorage.getItem('usuarioCorrente')) {
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
