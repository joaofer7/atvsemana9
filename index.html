<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Commerce - Home</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-light">

   <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm" style="border-bottom: 4px solid #007bff;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <span class="text-primary">LITTLE</span> COMMERCE
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarConteudo">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarConteudo">
            
            <form class="d-flex mx-auto my-2 my-lg-0 w-50">
                <div class="input-group">
                    <input class="form-control" type="search" placeholder="Buscar produtos..." aria-label="Search">
                    <button class="btn btn-outline-primary" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </form>

            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item ms-lg-3">
                    <button class="btn btn-primary d-flex align-items-center gap-2">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span class="d-none d-sm-inline">Carrinho</span>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <header class="container mt-5 text-center">
        <h2 class="fw-bold">Produtos em destaque</h2>
        <hr class="w-25 mx-auto" style="height: 3px; color: #007bff; opacity: 1;">
    </header>

    <main class="container my-5">
        <div id="product-list" class="row g-4 justify-content-center">
            </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
